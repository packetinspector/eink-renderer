[package]
name = "eink-renderer"
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
description = "Render a Home Assistant Lovelace dashboard to a 1-bit PNG for e-paper displays (ESPHome online_image), via a supervised headless Chrome"
readme = "README.md"
license = "MIT"
repository = "https://github.com/packetinspector/eink-renderer"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "net", "time", "sync", "signal", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.17"
base64 = "0.22"
libc = "0.2"
font8x8 = "0.3"
mdns-sd = "0.22.0"
if-addrs = "0.15.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
