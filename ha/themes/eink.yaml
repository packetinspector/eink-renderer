# E-ink themes for 1-bit e-paper displays rendered by eink-renderer.
# Pure black on white, no shadows/gradients/greys, hinted font present in the renderer image (DejaVu),
# icon colours forced to black so they survive the 1-bit threshold. Copy to <config>/themes/ (frontend: themes: !include_dir_merge_named themes).
E-ink:
  primary-font-family: "'DejaVu Sans', Roboto, sans-serif"
  paper-font-common-base_-_font-family: "'DejaVu Sans', Roboto, sans-serif"
  ha-font-family-body: "'DejaVu Sans', Roboto, sans-serif"
  ha-font-family-heading: "'DejaVu Sans', Roboto, sans-serif"
  ha-font-family-code: "'DejaVu Sans Mono', monospace"
  ha-font-weight-normal: "400"
  ha-font-weight-medium: "700"
  ha-font-weight-bold: "700"
  ha-card-box-shadow: "none"
  ha-card-border-width: "2px"
  ha-card-border-color: "#000000"
  ha-card-border-radius: "8px"
  ha-card-background: "#FFFFFF"
  card-background-color: "#FFFFFF"
  primary-background-color: "#FFFFFF"
  secondary-background-color: "#FFFFFF"
  lovelace-background: "#FFFFFF"
  primary-text-color: "#000000"
  secondary-text-color: "#000000"
  disabled-text-color: "#000000"
  text-primary-color: "#FFFFFF"
  primary-color: "#000000"
  accent-color: "#000000"
  divider-color: "#000000"
  state-icon-color: "#000000"
  state-active-color: "#000000"
  state-inactive-color: "#000000"
  paper-item-icon-color: "#000000"
  paper-item-icon-active-color: "#000000"
  rgb-primary-text-color: "0, 0, 0"
  rgb-state-inactive-color: "0, 0, 0"
  tile-color: "#000000"
  weather-icon-sun-color: "#000000"
  weather-icon-moon-color: "#000000"
  weather-icon-cloud-front-color: "#FFFFFF"
  weather-icon-cloud-back-color: "#000000"
  weather-icon-rain-color: "#000000"
  mdc-checkbox-unchecked-color: "#000000"
  mdc-checkbox-checked-color: "#000000"
  modes:
    light: {}

E-ink Bold:
  primary-font-family: "'DejaVu Sans', Roboto, sans-serif"
